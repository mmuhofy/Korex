[versions]
agp                 = "8.9.2"
kotlin              = "2.1.10"
ksp                 = "2.1.10-1.0.31"
composeBom          = "2026.04.01"
hilt                = "2.57.1"
hiltNavigate        = "1.2.0"
room                = "2.6.1"
datastore           = "1.1.1"
navigationCompose   = "2.9.7"
terminalView        = "0.118.0"
coreKtx             = "1.16.0"
lifecycle           = "2.9.0"
activityCompose     = "1.10.1"
materialComponents       = "1.12.0"
phosphorIcons       = "1.0.0"

[libraries]
# AndroidX Core
androidx-core-ktx               = { group = "androidx.core",                   name = "core-ktx",                      version.ref = "coreKtx" }
androidx-lifecycle-runtime      = { group = "androidx.lifecycle",               name = "lifecycle-runtime-ktx",         version.ref = "lifecycle" }
androidx-lifecycle-viewmodel    = { group = "androidx.lifecycle",               name = "lifecycle-viewmodel-compose",   version.ref = "lifecycle" }
androidx-activity-compose       = { group = "androidx.activity",                name = "activity-compose",              version.ref = "activityCompose" }

# Compose BOM + core artifacts
compose-bom                     = { group = "androidx.compose",                 name = "compose-bom",                   version.ref = "composeBom" }
compose-ui                      = { group = "androidx.compose.ui",              name = "ui" }
compose-ui-graphics             = { group = "androidx.compose.ui",              name = "ui-graphics" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",              name = "ui-tooling-preview" }
compose-ui-tooling              = { group = "androidx.compose.ui",              name = "ui-tooling" }
compose-material3               = { group = "androidx.compose.material3",       name = "material3" }
compose-foundation              = { group = "androidx.compose.foundation",      name = "foundation" }

# Material Icons — version managed by Compose BOM
compose-material-icons-core     = { group = "androidx.compose.material",        name = "material-icons-core" }
compose-material-icons-extended = { group = "androidx.compose.material",        name = "material-icons-extended-android" }

# Navigation
navigation-compose              = { group = "androidx.navigation",              name = "navigation-compose",            version.ref = "navigationCompose" }

# Hilt
hilt-android                    = { group = "com.google.dagger",                name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler                   = { group = "com.google.dagger",                name = "hilt-android-compiler",         version.ref = "hilt" }
hilt-navigation-compose         = { group = "androidx.hilt",                    name = "hilt-navigation-compose",       version.ref = "hiltNavigate" }

# Room
room-runtime                    = { group = "androidx.room",                    name = "room-runtime",                  version.ref = "room" }
room-ktx                        = { group = "androidx.room",                    name = "room-ktx",                      version.ref = "room" }
room-compiler                   = { group = "androidx.room",                    name = "room-compiler",                 version.ref = "room" }

# DataStore
datastore-preferences           = { group = "androidx.datastore",               name = "datastore-preferences",         version.ref = "datastore" }

materialComponents              = { group = "com.google.android.material", name = "material", version.ref = "materialComponents" }

# Phosphor Icons
phosphor-icons                  = { group = "com.adamglin",                     name = "phosphor-icon-android",         version.ref = "phosphorIcons" }

# Guava — provides ListenableFuture required by terminal-view
guava                           = { group = "com.google.guava",                 name = "guava",                         version = "33.0.0-android" }

# androidx.concurrent.futures needed by profileinstaller
concurrent-futures              = { group = "androidx.concurrent",              name = "concurrent-futures",            version = "1.2.0" }

[plugins]
android-application             = { id = "com.android.application",             version.ref = "agp" }
kotlin-android                  = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose                  = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt-android                    = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
ksp                             = { id = "com.google.devtools.ksp",             version.ref = "ksp" }