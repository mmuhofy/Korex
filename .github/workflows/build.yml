name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download pre-built bootstrap artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: bootstrap.yml
          name: bootstrap-korex-aarch64
          path: .
          if_no_artifact_found: fail

      - name: Verify bootstrap
        run: |
          ls -lh bootstrap-aarch64-korex.zip
          unzip -t bootstrap-aarch64-korex.zip | tail -3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          BOOTSTRAP_ZIP_PATH: ${{ github.workspace }}/bootstrap-aarch64-korex.zip
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: korex-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7