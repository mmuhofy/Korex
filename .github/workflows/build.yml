name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download and prepare bootstrap
        run: |
          RESPONSE=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/termux/termux-packages/releases)

          RELEASE=$(echo "$RESPONSE" \
            | jq -r '[.[] | select(type == "object") | select(.tag_name != null) | select(.tag_name | startswith("bootstrap-"))] | first | .tag_name')

          if [ -z "$RELEASE" ] || [ "$RELEASE" = "null" ]; then
            echo "ERROR: Could not find bootstrap release"
            echo "$RESPONSE" | head -50
            exit 1
          fi

          echo "Bootstrap release: $RELEASE"

          wget -q "https://github.com/termux/termux-packages/releases/download/${RELEASE}/bootstrap-aarch64.zip" \
            -O bootstrap-aarch64-original.zip

          # --- Extract bootstrap zip ---
          mkdir -p patched_bootstrap
          unzip -q bootstrap-aarch64-original.zip -d patched_bootstrap

          # --- Patch paths for Korex ---
          find patched_bootstrap -type f | while read f; do
            if file "$f" | grep -q "text"; then
              sed -i 's|/data/data/com\.termux|/data/data/com.muhofy.korex|g' "$f"
            fi
          done

          find patched_bootstrap -type f | while read f; do
            if file "$f" | grep -q "ELF"; then
              perl -pi -e 's|/data/data/com\.termux/|/data/data/com.muhofy.korex/|g' "$f" 2>/dev/null || true
            fi
          done

          # --- Extract shell binaries → jniLibs (noexec bypass) ---
          # These are placed in nativeLibraryDir by Android at install time,
          # which is always exec-able regardless of targetSdkVersion.
          JNILIBS_DIR="app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNILIBS_DIR"

          # Debug — show zip structure to find correct paths
          echo "=== Bootstrap zip contents (bin/) ==="
          find patched_bootstrap -name "bash" -o -name "zsh" 2>/dev/null
          echo "=== All files in usr/bin ==="
          ls patched_bootstrap/usr/bin/ 2>/dev/null || echo "usr/bin not found"
          echo "================================"

          # bash — primary shell entry point
          BASH_PATH=$(find patched_bootstrap -name "bash" -type f | head -1)
          if [ -n "$BASH_PATH" ]; then
            cp "$BASH_PATH" "$JNILIBS_DIR/libkorex-bash.so"
            echo "✓ libkorex-bash.so extracted from $BASH_PATH ($(du -sh "$JNILIBS_DIR/libkorex-bash.so" | cut -f1))"
          else
            echo "ERROR: bash not found anywhere in bootstrap"
            find patched_bootstrap -type f | head -30
            exit 1
          fi

          # zsh — preferred shell
          ZSH_PATH=$(find patched_bootstrap -name "zsh" -type f | head -1)
          if [ -n "$ZSH_PATH" ]; then
            cp "$ZSH_PATH" "$JNILIBS_DIR/libkorex-zsh.so"
            echo "✓ libkorex-zsh.so extracted from $ZSH_PATH ($(du -sh "$JNILIBS_DIR/libkorex-zsh.so" | cut -f1))"
          else
            echo "WARNING: zsh not found in bootstrap, skipping"
          fi

          ls -lh "$JNILIBS_DIR/"

          # --- Repack patched bootstrap zip (for JNI embed) ---
          cd patched_bootstrap
          zip -r9 ../bootstrap-aarch64-korex.zip . 2>/dev/null
          cd ..
          ls -lh bootstrap-aarch64-korex.zip

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          BOOTSTRAP_ZIP_PATH: ${{ github.workspace }}/bootstrap-aarch64-korex.zip
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: korex-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7