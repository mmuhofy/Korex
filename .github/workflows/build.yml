name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare bootstrap from Termux APK
        run: |
          TERMUX_APK_URL="https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3+github-debug_arm64-v8a.apk"

          echo "=== Downloading Termux APK ==="
          wget -q "$TERMUX_APK_URL" -O termux.apk
          ls -lh termux.apk

          echo "=== Extracting APK ==="
          mkdir -p termux-apk
          unzip -q termux.apk -d termux-apk

          echo "=== APK lib contents ==="
          ls termux-apk/lib/arm64-v8a/

          # Extract bootstrap zip from libtermux-bootstrap.so
          python3 - <<'PYEOF'
          import sys
          with open("termux-apk/lib/arm64-v8a/libtermux-bootstrap.so", "rb") as f:
              data = f.read()
          zip_magic = b'PK\x03\x04'
          offset = data.find(zip_magic)
          if offset == -1:
              print("ERROR: No ZIP magic found")
              sys.exit(1)
          print(f"ZIP payload at offset: {offset}")
          with open("bootstrap-termux-original.zip", "wb") as f:
              f.write(data[offset:])
          print(f"Extracted {len(data[offset:])} bytes")
          PYEOF

          echo "=== Extracting bootstrap ==="
          mkdir -p patched_bootstrap
          unzip -q bootstrap-termux-original.zip -d patched_bootstrap

          echo "=== Checking structure ==="
          ls patched_bootstrap/
          find patched_bootstrap -name "proot" | head -3

          # Patch com.termux → com.korexx (same byte length = 10, binary-safe)
          echo "=== Patching package name ==="
          find patched_bootstrap -type f | while read f; do
            if file "$f" | grep -q "text"; then
              sed -i 's/com\.termux/com.korexx/g' "$f"
            fi
          done
          find patched_bootstrap -type f | while read f; do
            if file "$f" | grep -q "ELF"; then
              perl -pi -e 's/com\.termux/com.korexx/g' "$f" 2>/dev/null || true
            fi
          done
          echo "✓ Patch done"

          # Copy libs to usr/lib
          if [ -d "patched_bootstrap/lib" ]; then
            mkdir -p patched_bootstrap/usr/lib
            cp -n patched_bootstrap/lib/*.so patched_bootstrap/usr/lib/ 2>/dev/null || true
            echo "✓ Copied /lib/*.so → usr/lib/"
          fi

          # Inject proot if not present
          if [ ! -f "patched_bootstrap/bin/proot" ]; then
            echo "=== proot not found, downloading ==="
            wget -q "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/proot_5.4.0-1_aarch64.deb" \
              -O proot.deb 2>/dev/null || true

            if [ ! -s proot.deb ]; then
              # Try to find latest proot deb
              PROOT_URL=$(curl -s "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/" \
                | grep -o 'proot_[^"]*_aarch64\.deb' | tail -1)
              wget -q "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/$PROOT_URL" -O proot.deb
            fi

            mkdir -p proot_extract
            cd proot_extract
            ar x ../proot.deb
            tar xf data.tar.xz 2>/dev/null || tar xf data.tar.gz 2>/dev/null
            cd ..

            PROOT_BIN=$(find proot_extract -name "proot" -type f | head -1)
            if [ -n "$PROOT_BIN" ]; then
              mkdir -p patched_bootstrap/bin
              cp "$PROOT_BIN" patched_bootstrap/bin/proot
              perl -pi -e 's/com\.termux/com.korexx/g' patched_bootstrap/bin/proot 2>/dev/null || true
              chmod +x patched_bootstrap/bin/proot
              echo "✓ proot injected"
            else
              echo "WARNING: proot binary not found in .deb"
            fi
          else
            echo "✓ proot already present"
          fi

          # Repack
          echo "=== Repacking ==="
          cd patched_bootstrap
          zip -r9 ../bootstrap-aarch64-korex.zip . 2>/dev/null
          cd ..
          ls -lh bootstrap-aarch64-korex.zip

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          BOOTSTRAP_ZIP_PATH: ${{ github.workspace }}/bootstrap-aarch64-korex.zip
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: korex-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7