name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download pre-built bootstrap artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: bootstrap.yml
          name: bootstrap-korex-aarch64
          path: .
          if_no_artifact_found: fail

      - name: Verify bootstrap
        run: |
          ls -lh bootstrap-aarch64-korex.zip
          unzip -t bootstrap-aarch64-korex.zip | tail -3

      - name: Inject proot into bootstrap
        run: |
          # Check if proot already in bootstrap
          if unzip -l bootstrap-aarch64-korex.zip | grep -q "bin/proot"; then
            echo "✓ proot already in bootstrap, skipping"
            exit 0
          fi

          echo "proot not found in bootstrap, downloading..."

          # Download proot .deb from Termux packages
          RESPONSE=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/termux/termux-packages/releases)

          RELEASE=$(echo "$RESPONSE" \
            | jq -r '[.[] | select(type == "object") | select(.tag_name != null) | select(.tag_name | startswith("bootstrap-"))] | first | .tag_name')

          echo "Release: $RELEASE"

          # Download proot deb
          wget -q "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/proot_5.4.0-1_aarch64.deb" \
            -O proot.deb || \
          wget -q "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/" \
            -O proot_index.html && \
          PROOT_DEB=$(grep -o 'proot_[^"]*_aarch64\.deb' proot_index.html | head -1) && \
          wget -q "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/$PROOT_DEB" -O proot.deb

          ls -lh proot.deb

          # Extract proot binary from .deb
          mkdir -p proot_extract
          cd proot_extract
          ar x ../proot.deb
          tar xf data.tar.xz 2>/dev/null || tar xf data.tar.gz 2>/dev/null
          cd ..

          PROOT_BIN=$(find proot_extract -name "proot" -type f | head -1)
          echo "Found proot at: $PROOT_BIN"

          if [ -z "$PROOT_BIN" ]; then
            echo "ERROR: proot binary not found in .deb"
            exit 1
          fi

          # Patch com.termux → com.korexx in proot binary
          perl -pi -e 's/com\.termux/com.korexx/g' "$PROOT_BIN" 2>/dev/null || true

          # Inject proot into bootstrap zip
          mkdir -p bootstrap_inject/bin
          cp "$PROOT_BIN" bootstrap_inject/bin/proot
          chmod +x bootstrap_inject/bin/proot

          cd bootstrap_inject
          zip -r9 ../bootstrap-aarch64-korex.zip bin/proot
          cd ..

          echo "✓ proot injected into bootstrap"
          unzip -l bootstrap-aarch64-korex.zip | grep proot

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          BOOTSTRAP_ZIP_PATH: ${{ github.workspace }}/bootstrap-aarch64-korex.zip
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: korex-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7