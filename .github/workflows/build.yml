name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download and prepare bootstrap
        run: |
          RESPONSE=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/termux/termux-packages/releases)

          RELEASE=$(echo "$RESPONSE" \
            | jq -r '[.[] | select(type == "object") | select(.tag_name != null) | select(.tag_name | startswith("bootstrap-"))] | first | .tag_name')

          if [ -z "$RELEASE" ] || [ "$RELEASE" = "null" ]; then
            echo "ERROR: Could not find bootstrap release"
            echo "$RESPONSE" | head -50
            exit 1
          fi

          echo "Bootstrap release: $RELEASE"

          wget -q "https://github.com/termux/termux-packages/releases/download/${RELEASE}/bootstrap-aarch64.zip" \
            -O bootstrap-aarch64-original.zip

          # --- Extract bootstrap zip ---
          mkdir -p patched_bootstrap
          unzip -q bootstrap-aarch64-original.zip -d patched_bootstrap

          # --- Patch paths for Korex ---
          find patched_bootstrap -type f | while read f; do
            if file "$f" | grep -q "text"; then
              sed -i 's|/data/data/com\.termux|/data/data/com.muhofy.korex|g' "$f"
            fi
          done

          find patched_bootstrap -type f | while read f; do
            if file "$f" | grep -q "ELF"; then
              perl -pi -e 's|/data/data/com\.termux/|/data/data/com.muhofy.korex/|g' "$f" 2>/dev/null || true
            fi
          done

          echo "=== Checking libandroid-support ==="
          find patched_bootstrap -name "libandroid-support*" 2>/dev/null || echo "NOT FOUND"
          echo "=== libs in usr/lib ==="
          ls patched_bootstrap/usr/lib/ 2>/dev/null | head -20 || echo "usr/lib not found"

          # libandroid-support.so lives in /lib not /usr/lib in the bootstrap zip.
          # Copy it to usr/lib so bash/zsh can find it at runtime via LD_LIBRARY_PATH.
          if [ -d "patched_bootstrap/lib" ]; then
            mkdir -p patched_bootstrap/usr/lib
            cp -n patched_bootstrap/lib/*.so patched_bootstrap/usr/lib/ 2>/dev/null || true
            echo "✓ Copied /lib/*.so → usr/lib/"
          fi

          # --- Run termux-elf-cleaner on all ELF binaries ---
          # Bootstrap binaries contain ELF entries unsupported by older Android linkers.
          # termux-elf-cleaner strips DT_HASH/DT_GNU_HASH issues and unused DT entries.
          curl -sL https://github.com/termux/termux-elf-cleaner/releases/latest/download/termux-elf-cleaner \
            -o termux-elf-cleaner
          chmod +x termux-elf-cleaner

          find patched_bootstrap -type f | while read f; do
            if file "$f" | grep -q "ELF"; then
              ./termux-elf-cleaner "$f" 2>/dev/null || true
            fi
          done
          echo "✓ ELF cleaning done"

          # --- Repack patched bootstrap zip (for JNI embed) ---
          cd patched_bootstrap
          zip -r9 ../bootstrap-aarch64-korex.zip . 2>/dev/null
          cd ..
          ls -lh bootstrap-aarch64-korex.zip

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          BOOTSTRAP_ZIP_PATH: ${{ github.workspace }}/bootstrap-aarch64-korex.zip
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: korex-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7