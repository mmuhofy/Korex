name: Generate Bootstrap

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Install required tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl wget jq zip unzip bzip2 xz-utils file perl

      - name: Get latest bootstrap release URL
        id: get_url
        run: |
          RESPONSE=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/termux/termux-packages/releases)

          echo "API response type: $(echo "$RESPONSE" | jq -r 'type')"

          RELEASE=$(echo "$RESPONSE" \
            | jq -r '[.[] | select(type == "object") | select(.tag_name != null) | select(.tag_name | startswith("bootstrap-"))] | first | .tag_name')

          if [ -z "$RELEASE" ] || [ "$RELEASE" = "null" ]; then
            echo "ERROR: Could not find a bootstrap release. API response:"
            echo "$RESPONSE" | head -50
            exit 1
          fi

          echo "Latest release: $RELEASE"

          URL="https://github.com/termux/termux-packages/releases/download/${RELEASE}/bootstrap-aarch64.zip"
          echo "Download URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT

      - name: Download bootstrap zip
        run: |
          wget -q "${{ steps.get_url.outputs.url }}" -O bootstrap-aarch64-original.zip
          ls -lh bootstrap-aarch64-original.zip

      - name: Patch bootstrap paths for Korex
        run: |
          mkdir -p patched_bootstrap
          unzip -q bootstrap-aarch64-original.zip -d patched_bootstrap

          echo "Total files: $(find patched_bootstrap -type f | wc -l)"

          # Patch text files
          find patched_bootstrap -type f | while read f; do
            if file "$f" | grep -q "text"; then
              sed -i 's|/data/data/com\.termux|/data/data/com.korexx|g' "$f"
            fi
          done

          # Patch ELF binaries with perl (handles binary strings)
          find patched_bootstrap -type f | while read f; do
            if file "$f" | grep -q "ELF"; then
              perl -pi -e 's|/data/data/com\.termux/|/data/data/com.korexx/|g' "$f" 2>/dev/null || true
            fi
          done

          # Repack
          cd patched_bootstrap
          zip -r9 ../bootstrap-aarch64.zip .
          cd ..
          ls -lh bootstrap-aarch64.zip

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-korex-aarch64
          path: bootstrap-aarch64.zip
          retention-days: 90