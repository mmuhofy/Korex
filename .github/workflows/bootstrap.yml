name: Build Bootstrap

on:
  workflow_dispatch:
    inputs:
      extra_packages:
        description: 'Extra packages to include (comma-separated, e.g. zsh,git,vim)'
        required: false
        default: 'zsh,git,vim,openssh'

jobs:
  build-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 hours — bootstrap build is slow

    steps:
      - name: Checkout Korex
        uses: actions/checkout@v4

      - name: Clone termux-packages
        run: |
          git clone --depth=1 https://github.com/termux/termux-packages.git
          echo "termux-packages cloned"

      - name: Patch properties.sh for com.termux
        run: |
          cd termux-packages

          # Patch package name — com.termux (10 chars) → com.termux (10 chars), same length
          sed -i 's/TERMUX_APP__PACKAGE_NAME="com\.termux"/TERMUX_APP__PACKAGE_NAME="com.termux"/' scripts/properties.sh

          # Verify patch
          grep "TERMUX_APP__PACKAGE_NAME" scripts/properties.sh | head -3

          echo "✓ Package name patched to com.termux"

      - name: Pull Termux Docker image
        run: |
          docker pull termux/package-builder:latest
          echo "✓ Docker image ready"

      - name: Build bootstrap for aarch64
        run: |
          cd termux-packages

          # Build extra packages list
          EXTRA="${{ github.event.inputs.extra_packages }}"
          ADD_ARGS=""
          if [ -n "$EXTRA" ]; then
            ADD_ARGS="--add $EXTRA"
          fi

          echo "Building bootstrap with extra packages: $EXTRA"

          # Run build inside Termux Docker container with --privileged for FUSE support
          docker run --rm --privileged \
            -v "$(pwd):/home/builder/termux-packages" \
            termux/package-builder:latest \
            bash -c "cd /home/builder/termux-packages && \
              ./scripts/build-bootstraps.sh \
              --architectures aarch64 \
              $ADD_ARGS"

          echo "✓ Bootstrap build complete"
          ls -lh bootstrap-aarch64.zip 2>/dev/null || ls -lh *.zip

      - name: Rename and verify bootstrap
        run: |
          cd termux-packages
          ZIP=$(ls bootstrap-aarch64.zip 2>/dev/null || ls bootstrap-*.zip | head -1)
          cp "$ZIP" ../bootstrap-aarch64-korex.zip
          ls -lh ../bootstrap-aarch64-korex.zip

          # Quick verify
          unzip -t ../bootstrap-aarch64-korex.zip | tail -3

          # Confirm com.termux is in the zip
          echo "=== Checking package name in bootstrap ==="
          unzip -p ../bootstrap-aarch64-korex.zip SYMLINKS.txt | grep -c "korexx" || true
          unzip -p ../bootstrap-aarch64-korex.zip SYMLINKS.txt | grep "korexx" | head -5

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-korex-aarch64
          path: bootstrap-aarch64-korex.zip
          retention-days: 90